<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="author" content="Хасполадов Эмиль, 8Т">
<title>Утро. Учительская. — Новелла ко Дню Учителя</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;800;900&family=Onest:wght@300;400;500;600;700&family=Caveat:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    touch-action: manipulation;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }

  body {
    font-family: 'Onest', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0a0e1a;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* ============================================================
     ФОН
     ============================================================ */
  .bg-layer {
    position: fixed;
    inset: 0;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    z-index: 0;
    transition: opacity 1.2s ease-in-out;
    will-change: opacity;
  }
  .bg-old { opacity: 1; }
  .bg-new { opacity: 0; }
  .bg-new.active { opacity: 1; }

  .bg {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(255,180,80,0.18), transparent 60%),
      radial-gradient(ellipse at 80% 80%, rgba(80,150,255,0.15), transparent 60%),
      linear-gradient(180deg, rgba(10,14,26,0.4) 0%, rgba(10,14,26,0.8) 70%);
  }

  /* ============================================================
     CG-СЦЕНА
     ============================================================ */
  .cg-stage {
    position: fixed;
    inset: 0;
    z-index: 3;
    display: none;
    justify-content: center;
    align-items: center;
    pointer-events: none;
    overflow: hidden;
    background: #000;
  }
  .cg-stage.active { display: flex; }

  .cg-image {
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transform: scale(1);
    animation: cgZoomIn 10s ease-in-out forwards;
  }

  @keyframes cgZoomIn {
    0%   { opacity: 0; transform: scale(1.00); }
    10%  { opacity: 1; transform: scale(1.02); }
    90%  { opacity: 1; transform: scale(1.15); }
    100% { opacity: 0; transform: scale(1.15); }
  }

  .cg-stage::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 35%, rgba(10,14,26,0.75) 100%);
    pointer-events: none;
  }

  body.cg-active .scene {
    opacity: 0;
    pointer-events: none;
  }
  body.cg-active .scene {
    transition: opacity 0.5s ease 0.3s;
  }
  .scene {
    transition: opacity 0.5s ease;
  }

  /* ==== ЗАГРУЗКА ==== */
  .loader {
    position: fixed; inset: 0;
    background: linear-gradient(160deg, #0f1420 0%, #1a1e2e 100%);
    z-index: 999;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 25px;
    padding: 20px;
    transition: opacity 0.6s ease, visibility 0.6s ease;
  }
  .loader.hidden { opacity: 0; visibility: hidden; }
  .loader-title {
    font-family: 'Unbounded', sans-serif;
    font-weight: 800;
    font-size: clamp(18px, 4.5vw, 26px);
    color: #ffd700;
    letter-spacing: 0;
    text-shadow: 0 0 20px rgba(255,215,0,0.5);
    animation: pulse 2s ease-in-out infinite;
    text-align: center;
  }
  @keyframes pulse { 0%,100% { opacity: 0.7; } 50% { opacity: 1; } }
  .loader-bar {
    width: min(420px, 80vw);
    height: 12px;
    background: rgba(255,255,255,0.08);
    border: 2px solid rgba(255,215,0,0.4);
    border-radius: 20px;
    overflow: hidden;
  }
  .loader-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #ffd700, #ffa500);
    border-radius: 20px;
    transition: width 0.3s ease;
    box-shadow: 0 0 20px rgba(255,215,0,0.7);
  }
  .loader-percent {
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    color: #ffd700;
    font-weight: 600;
  }
  .loader-status {
    font-family: 'Onest', sans-serif;
    font-size: 13px;
    color: #8892a6;
    min-height: 20px;
    font-style: italic;
    text-align: center;
    letter-spacing: 0.5px;
  }

  /* ==== КНОПКА «ПРОПУСТИТЬ CG» ==== */
  .cg-skip {
    position: fixed;
    bottom: max(30px, env(safe-area-inset-bottom, 30px));
    right: max(30px, env(safe-area-inset-right, 30px));
    z-index: 20;
    padding: 14px 28px;
    background: rgba(10, 15, 30, 0.9);
    border: 2px solid rgba(255,215,0,0.6);
    border-radius: 40px;
    color: #ffd700;
    font-family: 'Onest', sans-serif;
    font-weight: 600;
    font-size: clamp(14px, 3.6vw, 16px);
    letter-spacing: 0.5px;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease, transform 0.2s, background 0.2s;
    backdrop-filter: blur(8px);
    -webkit-user-select: none;
    user-select: none;
    min-height: 48px;
  }
  .cg-skip.visible {
    opacity: 1;
    pointer-events: auto;
  }
  .cg-skip:active { transform: scale(0.96); background: rgba(255,215,0,0.2); }

  /* ==== КНОПКА ЗВУКА ==== */
  .sound-toggle {
    position: fixed;
    top: max(15px, env(safe-area-inset-top, 15px));
    left: 15px;
    z-index: 50;
    width: 48px; height: 48px;
    border-radius: 50%;
    background: rgba(0,0,0,0.6);
    border: 2px solid rgba(255,215,0,0.5);
    color: #ffd700;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: transform 0.2s, background 0.2s, opacity 0.5s ease;
    backdrop-filter: blur(6px);
    -webkit-user-select: none;
    user-select: none;
  }
  .sound-toggle:active { transform: scale(0.95); background: rgba(255,215,0,0.2); }
  .sound-toggle.muted { color: #8892a6; border-color: #555; }
  body.cg-active .sound-toggle { opacity: 0; pointer-events: none; }

  /* ==== СЦЕНА ==== */
  .scene {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 1100px;
    z-index: 5;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: max(20px, env(safe-area-inset-top, 20px))
             max(20px, env(safe-area-inset-right, 20px))
             max(20px, env(safe-area-inset-bottom, 20px))
             max(20px, env(safe-area-inset-left, 20px));
  }

  /* ==== ПОРТРЕТ ==== */
  .portrait-stage {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    pointer-events: none;
    z-index: 2;
    overflow: hidden;
  }

  .portrait {
    position: relative;
    margin-top: 10px;
    height: 78%;
    max-height: 700px;
    width: auto;
    max-width: 95%;
    object-fit: contain;
    filter: drop-shadow(0 25px 50px rgba(0,0,0,0.8))
            drop-shadow(0 0 60px rgba(255,215,0,0.35));
    transition: opacity 0.6s ease, transform 0.6s ease;
    pointer-events: auto;
    cursor: pointer;
    -webkit-user-drag: none;
    opacity: 1;
  }

  .portrait.float { animation: floatSlow 7s ease-in-out infinite; }
  @keyframes floatSlow {
    0%   { transform: translateY(0); }
    50%  { transform: translateY(22px); }
    100% { transform: translateY(0); }
  }

  .portrait.enter-top    { animation: enterTop 1.05s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
  .portrait.enter-bottom { animation: enterBottom 1.05s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
  .portrait.enter-left   { animation: enterLeft 1.05s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
  .portrait.enter-right  { animation: enterRight 1.05s cubic-bezier(0.22, 1, 0.36, 1) forwards; }

  @keyframes enterTop    { 0% { transform: translateY(-110vh); } 100% { transform: translateY(0); } }
  @keyframes enterBottom { 0% { transform: translateY(110vh); }  100% { transform: translateY(0); } }
  @keyframes enterLeft   { 0% { transform: translateX(-110vw); } 100% { transform: translateX(0); } }
  @keyframes enterRight  { 0% { transform: translateX(110vw); }  100% { transform: translateX(0); } }

  .portrait.shake { animation: gentleShake 0.9s ease-in-out; }
  @keyframes gentleShake {
    0%   { transform: translateX(0); }
    15%  { transform: translateX(-14px); }
    30%  { transform: translateX(14px); }
    45%  { transform: translateX(-10px); }
    60%  { transform: translateX(10px); }
    75%  { transform: translateX(-6px); }
    90%  { transform: translateX(6px); }
    100% { transform: translateX(0); }
  }

  .portrait.fade {
    opacity: 0;
    transform: scale(0.94) translateY(30px);
  }

  .portrait-glow {
    position: absolute;
    top: 15%; left: 50%;
    transform: translateX(-50%);
    width: min(700px, 90vw);
    height: min(700px, 90vw);
    background: radial-gradient(circle, rgba(255,215,0,0.22), transparent 65%);
    pointer-events: none;
    animation: pulseGlow 4s ease-in-out infinite;
  }
  @keyframes pulseGlow { 0%,100% { opacity: 0.5; } 50% { opacity: 0.9; } }

  /* ==== ДИАЛОГ ==== */
  .dialogue {
    background: rgba(10, 15, 30, 0.94);
    border: 3px solid rgba(255,215,0,0.7);
    border-radius: 20px;
    padding: 25px 30px;
    min-height: 200px;
    box-shadow: 0 15px 50px rgba(0,0,0,0.7), inset 0 0 40px rgba(255,215,0,0.05);
    position: relative;
    z-index: 5;
    animation: slideUp 0.5s ease;
    backdrop-filter: blur(6px);
  }
  @keyframes slideUp {
    from { transform: translateY(40px); opacity: 0; }
    to   { transform: translateY(0);    opacity: 1; }
  }

  .name-tag {
    position: absolute;
    top: -18px;
    left: 20px;
    background: linear-gradient(135deg, #ffd700, #ffa500);
    color: #1a1e2e;
    padding: 7px 22px;
    border-radius: 30px;
    font-family: 'Unbounded', sans-serif;
    font-weight: 700;
    font-size: clamp(12px, 3vw, 15px);
    letter-spacing: 0;
    box-shadow: 0 4px 15px rgba(255,215,0,0.5);
    white-space: nowrap;
    max-width: 85%;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .name-tag.narrator {
    background: linear-gradient(135deg, #7a9cff, #5577dd);
    color: #fff;
    font-weight: 500;
    font-style: italic;
  }

  .text {
    font-family: 'Onest', sans-serif;
    font-weight: 400;
    font-size: clamp(16px, 4vw, 19px);
    line-height: 1.65;
    margin: 15px 0 10px;
    min-height: 70px;
    color: #e8ecf5;
  }
  .text em {
    font-family: 'Caveat', cursive;
    font-style: normal;
    font-size: 1.35em;
    color: #ffd700;
    font-weight: 600;
  }

  /* ==== ОТВЕТЫ ==== */
  .answers { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
  .answer-btn {
    background: rgba(255,255,255,0.07);
    color: #fff;
    border: 2px solid rgba(255,215,0,0.4);
    padding: 16px 20px;
    font-family: 'Onest', sans-serif;
    font-weight: 500;
    font-size: clamp(15px, 3.8vw, 17px);
    border-radius: 12px;
    cursor: pointer;
    text-align: left;
    transition: background 0.2s, border-color 0.2s, transform 0.15s;
    min-height: 54px;
    -webkit-user-select: none;
    user-select: none;
  }
  .answer-btn:active:not(:disabled) {
    background: rgba(255,215,0,0.2);
    border-color: #ffd700;
    transform: scale(0.99);
  }
  .answer-btn.correct {
    background: linear-gradient(135deg, #2ecc71, #27ae60);
    border-color: #2ecc71;
  }
  .answer-btn.wrong {
    background: linear-gradient(135deg, #e74c3c, #c0392b);
    border-color: #e74c3c;
  }

  /* ==== КНОПКИ ==== */
  .btn {
    background: linear-gradient(135deg, #ffd700, #ffa500);
    color: #1a1e2e;
    border: none;
    padding: 16px 42px;
    font-family: 'Onest', sans-serif;
    font-weight: 700;
    font-size: clamp(16px, 4.2vw, 19px);
    letter-spacing: 0.3px;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 8px 25px rgba(255,215,0,0.5);
    transition: transform 0.15s;
    margin-top: 12px;
    min-height: 54px;
    -webkit-user-select: none;
    user-select: none;
  }
  .btn:active { transform: scale(0.97); }
  .center { text-align: center; }

  /* ==== СТРЕЛКА ==== */
  .continue {
    position: absolute;
    right: 18px;
    bottom: 12px;
    font-size: 28px;
    color: #ffd700;
    cursor: pointer;
    animation: bounce 1.2s infinite;
    padding: 14px;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    min-width: 52px;
    min-height: 52px;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .continue:active { transform: scale(0.92); }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }

  /* ==== НАГРАДА ==== */
  .reward {
    position: absolute;
    top: 35%; left: 50%;
    transform: translateX(-50%);
    font-family: 'Unbounded', sans-serif;
    font-weight: 800;
    font-size: clamp(26px, 7vw, 40px);
    color: #ffd700;
    letter-spacing: 0;
    text-shadow: 0 0 30px #ffd700, 0 0 60px rgba(255,215,0,0.6);
    animation: rewardAnim 1.8s ease forwards;
    pointer-events: none;
    z-index: 30;
    text-align: center;
    max-width: 90vw;
  }
  @keyframes rewardAnim {
    0%   { opacity: 0; transform: translate(-50%, 40px) scale(0.4); }
    25%  { opacity: 1; transform: translate(-50%, 0) scale(1.15); }
    70%  { opacity: 1; transform: translate(-50%, -10px) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -70px) scale(0.9); }
  }

  /* ============================================================
     ТИТРЫ — ПО НАЖАТИЮ ЭКРАНА
     ============================================================ */
  .credits-wrapper {
    position: fixed;
    inset: 0;
    z-index: 20;
    background: #000;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
  }

  .credits-page {
    width: 100%;
    max-width: 720px;
    max-height: 100%;
    padding: 40px 24px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: #ffd700;
    font-family: 'Onest', sans-serif;
    animation: pageFadeIn 0.6s ease;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
  }

  @keyframes pageFadeIn {
    from { opacity: 0; transform: scale(0.96); }
    to   { opacity: 1; transform: scale(1); }
  }

  .credits-page-title {
    font-family: 'Unbounded', sans-serif;
    font-weight: 800;
    font-size: clamp(24px, 6vw, 38px);
    color: #ffd700;
    letter-spacing: 3px;
    margin-bottom: 25px;
    text-transform: uppercase;
    line-height: 1.2;
  }

  .credits-page-subtitle {
    font-family: 'Onest', sans-serif;
    font-size: clamp(13px, 3.4vw, 16px);
    color: #8892a6;
    font-style: italic;
    margin-bottom: 30px;
    line-height: 1.6;
  }

  .credits-section {
    font-family: 'Unbounded', sans-serif;
    font-weight: 700;
    font-size: clamp(14px, 3.6vw, 18px);
    color: #ffd700;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin: 25px 0 15px;
    position: relative;
    padding-bottom: 10px;
    width: 100%;
  }
  .credits-section::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 60px;
    height: 2px;
    background: linear-gradient(90deg, transparent, #ffd700, transparent);
  }
  .credits-section:first-child { margin-top: 0; }

  .credits-row {
    margin-bottom: 12px;
    line-height: 1.35;
    width: 100%;
  }
  .credits-role {
    color: #8892a6;
    font-size: clamp(10px, 2.8vw, 12px);
    text-transform: uppercase;
    letter-spacing: 1.2px;
    margin-bottom: 2px;
  }
  .credits-name {
    color: #ffd700;
    font-family: 'Unbounded', sans-serif;
    font-size: clamp(12px, 3.2vw, 15px);
    font-weight: 700;
  }

  .credits-divider {
    width: 100%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,215,0,0.5), transparent);
    margin: 25px 0;
  }

  .credits-author-label {
    font-family: 'Onest', sans-serif;
    font-style: italic;
    font-size: clamp(12px, 3.2vw, 14px);
    color: #8892a6;
    margin-bottom: 8px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }
  .credits-author {
    font-family: 'Unbounded', sans-serif;
    font-weight: 800;
    font-size: clamp(24px, 6vw, 38px);
    color: #ffd700;
    letter-spacing: 2px;
    margin: 12px 0;
    line-height: 1.2;
    text-transform: uppercase;
  }
  .credits-class {
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(13px, 3.4vw, 16px);
    color: #7a9cff;
    margin: 8px 0 0;
    letter-spacing: 4px;
    font-weight: 600;
  }

  .credits-thanks {
    font-family: 'Onest', sans-serif;
    font-size: clamp(13px, 3.4vw, 16px);
    color: #8892a6;
    font-style: italic;
    margin-top: 20px;
    line-height: 1.7;
    max-width: 500px;
    margin-left: auto;
    margin-right: auto;
  }

  .credits-end {
    font-family: 'Unbounded', sans-serif;
    font-weight: 800;
    font-size: clamp(22px, 5.5vw, 32px);
    color: #ffd700;
    letter-spacing: 5px;
    margin: 25px 0;
    text-transform: uppercase;
  }

  .credits-egg {
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(10px, 2.6vw, 12px);
    color: #555;
    margin-top: 25px;
    letter-spacing: 1.5px;
    line-height: 1.7;
  }

  /* Подсказка внизу экрана */
  .credits-hint {
    position: fixed;
    bottom: max(20px, env(safe-area-inset-bottom, 20px));
    left: 50%;
    transform: translateX(-50%);
    z-index: 25;
    font-family: 'Onest', sans-serif;
    font-size: clamp(11px, 2.8vw, 13px);
    color: #8892a6;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    pointer-events: none;
    animation: hintPulse 2s ease-in-out infinite;
    text-align: center;
  }
  @keyframes hintPulse {
    0%,100% { opacity: 0.4; }
    50%     { opacity: 0.9; }
  }

  /* Индикатор страниц */
  .credits-dots {
    position: fixed;
    top: max(20px, env(safe-area-inset-top, 20px));
    left: 50%;
    transform: translateX(-50%);
    z-index: 25;
    display: flex;
    gap: 8px;
    pointer-events: none;
  }
  .credits-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(255,215,0,0.25);
    transition: background 0.3s, transform 0.3s;
  }
  .credits-dot.active {
    background: #ffd700;
    transform: scale(1.3);
  }

  /* ==== ПАЗЛ ==== */
  .puzzle-wrap {
    margin: 15px 0;
    display: flex;
    justify-content: center;
  }
  .puzzle {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 4px;
    width: min(360px, 70vw);
    aspect-ratio: 1 / 1;
    background: #000;
    padding: 6px;
    border: 3px solid rgba(255,215,0,0.5);
    border-radius: 12px;
    box-shadow: 0 0 40px rgba(255,215,0,0.2);
  }
  .puzzle-tile {
    width: 100%;
    height: 100%;
    background-size: 300% 300%;
    background-repeat: no-repeat;
    background-color: #1a1e2e;
    cursor: pointer;
    border-radius: 4px;
    transition: transform 0.15s, box-shadow 0.15s, filter 0.2s;
    -webkit-user-select: none;
    user-select: none;
    position: relative;
    overflow: hidden;
  }
  .puzzle-tile:active:not(.locked) {
    transform: scale(0.98);
  }
  .puzzle-tile.selected {

    position: fixed; top: -10px;

    z-index: 100;
    pointer-events: none;
  }
  @keyframes fall {
    to { transform: translateY(105vh) rotate(720deg); opacity: 0; }
  }

  /* ==== ГАЛКА-ПАСХАЛКА ==== */
  .egg-check {
    position: fixed;
    bottom: 10px;
    right: 10px;
    width: 32px;
    height: 32px;
    z-index: 60;
    cursor: pointer;
    opacity: 0.15;
    transition: opacity 0.4s, transform 0.3s;
    -webkit-user-select: none;
    user-select: none;
    font-size: 22px;
    display: flex;

<script>

const AUDIO = {
  music: "audio/music.mp3",
  click: "audio/click.mp3",
  tap:   "audio/tap.mp3"
};

let musicEl = null;
let soundMuted = false;
const audioCache = {};

function playSound(key) {
  if (soundMuted) return;
  const url = AUDIO[key];
  if (!url) return;
  if (!(key in audioCache)) {
    const a = new Audio(url);
    a.preload = 'auto';
    a.volume = 0.6;
    a.addEventListener('error', () => {
      console.warn(`Звук не загрузился: ${url}`);
      audioCache[key] = null;
    });
    audioCache[key] = a;
  }
  const el = audioCache[key];
  if (!el) return;
  try {
    el.currentTime = 0;
    const p = el.play();
    if (p && p.catch) p.catch(() => {});
  } catch(e) {}
}

const SFX = {
  click: () => playSound('click'),
  tap:   () => playSound('tap')
};

function startMusic() {
  if (!AUDIO.music) return;
  if (!musicEl) {
    musicEl = new Audio(AUDIO.music);
    musicEl.loop = true;
    musicEl.volume = 0.35;
    musicEl.preload = 'auto';
    musicEl.addEventListener('error', () => {
      console.warn('Музыка не загрузилась:', AUDIO.music);
      musicEl = null;
    });
  }
  if (!musicEl) return;
  musicEl.muted = soundMuted;
  const p = musicEl.play();
  if (p && p.catch) p.catch(err => console.warn('Автоплей заблокирован:', err));
}

const soundToggle = document.getElementById('soundToggle');
soundToggle.addEventListener('click', () => {
  soundMuted = !soundMuted;
  if (musicEl) musicEl.muted = soundMuted;
  soundToggle.textContent = soundMuted ? '🔇' : '🔊';
  soundToggle.classList.toggle('muted', soundMuted);
});

/* ============================================================
   🎨 ФОН
   ============================================================ */
let currentBgUrl = null;

function setBackground(url) {
  if (!url || url === currentBgUrl) return;
  const oldLayer = document.getElementById('bgOld');
  const newLayer = document.getElementById('bgNew');

  const preload = new Image();
  preload.onload = () => {
    newLayer.style.backgroundImage = `url('${url}')`;
    newLayer.classList.add('active');
    setTimeout(() => {
      oldLayer.style.backgroundImage = `url('${url}')`;
      newLayer.classList.remove('active');
    }, 1200);
    currentBgUrl = url;
  };
  preload.onerror = () => console.warn('Фон не загрузился:', url);
  preload.src = url;
}

/* ============================================================
   🎬 CG + кнопка Пропустить
   ============================================================ */
let cgTimer = null;

function showCG(url, duration = 10000) {
  if (!url) return;
  const stage = document.getElementById('cgStage');
  const skipBtn = document.getElementById('cgSkip');

  stage.innerHTML = `<img class="cg-image" src="${url}" alt="">`;
  stage.classList.add('active');
  document.body.classList.add('cg-active');

  setTimeout(() => skipBtn.classList.add('visible'), 1500);
  cgTimer = setTimeout(endCG, duration);

  skipBtn.onclick = () => {
    SFX.click();
    endCG();
  };
}

function endCG() {
  const stage = document.getElementById('cgStage');
  const skipBtn = document.getElementById('cgSkip');

  if (cgTimer) { clearTimeout(cgTimer); cgTimer = null; }
  skipBtn.classList.remove('visible');
  stage.classList.remove('active');
  document.body.classList.remove('cg-active');
  setTimeout(() => { stage.innerHTML = ''; }, 500);
}

/* ============================================================
   АВТООПРЕДЕЛЕНИЕ ФОНА
   ============================================================ */
function bgByLoc(loc) {
  if (!loc) return BG.uchitelskaya;
  const l = loc.toLowerCase();
  if (l.includes('после концерта')) return BG.vecher;
  if (l.includes('концерт начинается')) return BG.scena;
  if (l.includes('актовый зал')) return BG.aktovyi;
  if (l.includes('сцена')) return BG.scena;
  if (l.includes('коридор')) return BG.koridor;
  return BG.uchitelskaya;
}

let achievements = [];

  toast.innerHTML = text + (sub ? `<small>${sub}</small>` : '');
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3200);
}

function unlockAchievement(id, title, desc) {
  if (achievements.find(a => a.id === id)) return;
  achievements.push({ id, title, desc });
  SFX.tap();
  showToast(`🏆 Достижение: ${title}`, desc);
}

const eggCheck = document.getElementById('eggCheck');
eggCheck.addEventListener('click', () => {

});

let zavuchClicks = 0;
let continueClicks = 0;
document.addEventListener('click', (e) => {
  if (e.target.classList.contains('continue')) {
    continueClicks++;
    if (continueClicks === 10 && !window.continueEggDone) {
      window.continueEggDone = true;
      continueClicks = 0;
      easterEggsFound++;
      SFX.tap();
      showToast('Спидран-режим.', 'Ты кликнул стрелку 10 раз подряд.');
      unlockAchievement('egg2', 'Спидран', 'Кликнул ▼ 10 раз подряд');

    continueClicks = 0;
  }

function preloadImages(urls) {
  const unique = [...new Set(urls.filter(Boolean))];
  let loaded = 0;
  const total = unique.length;
  return new Promise((resolve) => {
    if (total === 0) return resolve();
    const updateProgress = (status) => {
      const percent = Math.round((loaded / total) * 100);
      document.getElementById('loaderFill').style.width = percent + '%';
      document.getElementById('loaderPercent').textContent = percent + '%';
      document.getElementById('loaderStatus').textContent = status;
    };
    updateProgress('Загрузка спрайтов');
    unique.forEach((url) => {
      const img = new Image();
      img.onload = () => {
        loaded++;
        updateProgress(`Загружено ${loaded} из ${total}`);
        if (loaded === total) setTimeout(resolve, 400);
      };
      img.onerror = () => {
        loaded++;
        updateProgress(`Пропущено: ${loaded} из ${total}`);
        if (loaded === total) setTimeout(resolve, 400);
      };
      img.src = url;
    });
  });
}

function startQuest() {
  startMusic();

function renderScene() {
  if (current >= script.length) { renderFinal(); return; }
  const s = script[current];

  setBackground(bgByLoc(s.loc));

  if (s.cg) {
    showCG(s.cg, s.cgDuration || 10000);
  }

  const dir = s.dir || 'bottom';
  const dirClass = `enter-${dir}`;

  const portraitHTML = s.photo
    ? `<div class="portrait-stage">
         <div class="portrait-glow"></div>
         <img class="portrait" id="portraitImg" src="${s.photo}" alt="">
       </div>` : '';

  let dialogueHTML = '';

  if (s.type === 'narrate') {
    dialogueHTML = `
      <div class="dialogue">
        <div class="name-tag narrator">${s.loc || '...'}</div>
        <div class="text">${s.text}</div>
        <div class="continue" onclick="next()">▼</div>
      </div>`;
  } else if (s.type === 'line') {
    dialogueHTML = `
      <div class="dialogue">
        <div class="name-tag">${s.name}</div>
        <div class="text">«${s.text}»</div>
        <div class="continue" onclick="next()">▼</div>
      </div>`;
  } else if (s.type === 'quiz') {
    dialogueHTML = `
      <div class="dialogue">
        <div class="name-tag">❓ ${s.name}</div>
        <div class="text" style="margin-top:25px;">${s.question}</div>
        <div class="answers" id="answers">
          ${s.answers.map((a, i) =>
            `<button class="answer-btn" onclick="check(${i})">${String.fromCharCode(1040+i)}. ${a}</button>`
          ).join('')}
        </div>
        <div id="fb" style="margin-top:15px;font-size:17px;font-weight:bold;min-height:24px;"></div>
      </div>`;
  }

  scene.innerHTML = portraitHTML + dialogueHTML;

  const img = document.getElementById('portraitImg');
  if (img) {
    img.classList.add(dirClass);
    const onEnd = (e) => {
      if (e.animationName.startsWith('enter')) {
        img.classList.remove(dirClass);
        img.classList.add('float');
        img.removeEventListener('animationend', onEnd);
      }
    };
    img.addEventListener('animationend', onEnd);
    attachPortraitEvents();
  }
}

let lastClickLine = "";
let lastClickTime = 0;

function attachPortraitEvents() {
  const img = document.getElementById('portraitImg');
  if (!img) return;
  img.addEventListener('click', () => {
    SFX.tap();
    img.classList.remove('shake');
    void img.offsetWidth;
    img.classList.add('shake');
    setTimeout(() => img.classList.remove('shake'), 900);

    const s = script[current];
    if (!s) return;

    const now = Date.now();
    if (now - lastClickTime > 1000) {
      lastClickTime = now;
      const lines = CLICK_LINES[s.name];
      if (lines && lines.length) {
        let line = lines[Math.floor(Math.random() * lines.length)];
        if (line === lastClickLine && lines.length > 1) {
          line = lines[(lines.indexOf(line) + 1) % lines.length];
        }
        lastClickLine = line;
        showToast(line, s.name);
      }
    }

    if (s.name === "Завуч") {
      zavuchClicks++;
      if (zavuchClicks === 5 && !window.zavuchEggDone) {
        window.zavuchEggDone = true;
        easterEggsFound++;
        showToast('Завуч одобряет.', 'Молча. Кивнув.');
        unlockAchievement('egg3', 'Друг завуча', 'Кликнул по завучу 5 раз');
      }
    }
  });
}

function next() {
  SFX.click();
  current++;
  renderScene();
}

function check(i) {
  const s = script[current];
  const btns = document.querySelectorAll('.answer-btn');
  const fb = document.getElementById('fb');

  if (i === s.correct) {
    SFX.click();
    btns[i].classList.add('correct');
    btns.forEach(b => b.disabled = true);
    fb.style.color = '#2ecc71';
    fb.textContent = '✅ Верно!';

    const rw = document.createElement('div');
    rw.className = 'reward';
    rw.textContent = s.reward;
    scene.appendChild(rw);

    const img = document.getElementById('portraitImg');
    if (img) {
      img.classList.remove('float');
      img.classList.add('fade');
    }

    setTimeout(() => { current++; renderScene(); }, 2000);
  } else {
    SFX.click();
    btns[i].classList.add('wrong');
    fb.style.color = '#e74c3c';
    fb.textContent = '❌ Не совсем. Попробуй ещё!';
    setTimeout(() => btns[i].classList.remove('wrong'), 600);
  }
}

let puzzleOrder = [];
let puzzleSelected = null;
let puzzleMoves = 0;

function showPuzzle() {
  SFX.click();

  puzzleOrder = [0,1,2,3,4,5,6,7,8];
  do {
    shuffleArr(puzzleOrder);
  } while (isSolved(puzzleOrder));
  puzzleSelected = null;
  puzzleMoves = 0;

  const tilesHTML = puzzleOrder.map((tileIdx, i) => {
    const col = tileIdx % 3;
    const row = Math.floor(tileIdx / 3);
    const bgPos = `${col * 50}% ${row * 50}%`;
    return `<div class="puzzle-tile" data-pos="${i}" data-tile="${tileIdx}"
                 style="background-image:url('${PUZZLE_IMG}');background-position:${bgPos};"
                 onclick="puzzleClick(${i})"></div>`;
  }).join('');

  scene.innerHTML = `
    <div class="dialogue">
      <div class="name-tag">🧩 Пазл</div>
      <div class="text center" style="margin-top:25px;">
        <p style="font-family:'Unbounded',sans-serif;font-weight:700;color:#ffd700;font-size:clamp(16px,4vw,20px);">
          Собери Дмитрия и Павла
        </p>
        <p style="margin-top:10px;">
          Кликай по двум фрагментам, чтобы поменять их местами.
        </p>
        <div class="puzzle-wrap">
          <div class="puzzle" id="puzzle">${tilesHTML}</div>
        </div>
        <div class="puzzle-info" id="puzzleInfo">Ходов: 0</div>
      </div>
      <div class="center" style="margin-top:10px;">
        <button class="btn" onclick="skipPuzzle()" style="background:rgba(255,255,255,0.1);color:#8892a6;box-shadow:none;font-size:15px;padding:12px 28px;">
          Пропустить
        </button>
      </div>
    </div>
  `;
}

function shuffleArr(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
}

function isSolved(order) {
  return order.every((v, i) => v === i);
}

function puzzleClick(pos) {
  const tiles = document.querySelectorAll('.puzzle-tile');
  const tile = tiles[pos];
  if (!tile || tile.classList.contains('locked')) return;

  SFX.click();

  if (puzzleSelected === null) {
    puzzleSelected = pos;
    tile.classList.add('selected');
    return;
  }

  if (puzzleSelected === pos) {
    tile.classList.remove('selected');
    puzzleSelected = null;
    return;
  }

  const prev = puzzleSelected;
  [puzzleOrder[prev], puzzleOrder[pos]] = [puzzleOrder[pos], puzzleOrder[prev]];
  puzzleSelected = null;

  puzzleMoves++;
  tiles.forEach((t, i) => {
    t.classList.remove('selected');
    const tileIdx = puzzleOrder[i];
    const col = tileIdx % 3;
    const row = Math.floor(tileIdx / 3);
    t.style.backgroundPosition = `${col * 50}% ${row * 50}%`;
    t.dataset.tile = tileIdx;
  });

  document.getElementById('puzzleInfo').textContent = `Ходов: ${puzzleMoves}`;

  if (isSolved(puzzleOrder)) {
    tiles.forEach(t => {
      t.classList.add('locked', 'correct-flash');
    });
    SFX.tap();
    setTimeout(() => puzzleWin(), 800);
  }
}

function skipPuzzle() {
  SFX.click();
  showCredits(false);
}

function puzzleWin() {
  unlockAchievement('puzzle', 'Хранитель истории', `Пазл собран за ${puzzleMoves} ходов`);
  launchConfetti();
  setTimeout(() => showCredits(true), 1200);
}

function renderCreditsPage() {
  const page = creditsData[creditsPage];

  const sectionsHTML = page.sections.map(section => `
    <div class="credits-section">${section.name}</div>

      <div class="credits-row">
        <div class="credits-role">${r.role}</div>
        <div class="credits-name">${r.who}</div>
      </div>
    `).join('')}
  `).join('');

  // Индикатор страниц
  const dotsHTML = creditsData.map((_, i) =>
    `<div class="credits-dot ${i === creditsPage ? 'active' : ''}"></div>`
  ).join('');

  scene.innerHTML = `
    <div class="credits-wrapper" id="creditsWrapper">
      <div class="credits-dots">${dotsHTML}</div>
      <div class="credits-page">
        <div class="credits-page-title">${page.title}</div>
        ${page.subtitle ? `<div class="credits-page-subtitle">${page.subtitle}</div>` : ''}
        ${sectionsHTML}
      </div>
      <div class="credits-hint">Тапни, чтобы продолжить</div>
    </div>
  `;

  // Клик по обёртке — переход на следующую страницу
  const wrapper = document.getElementById('creditsWrapper');
  wrapper.onclick = () => {
    SFX.click();
    nextCreditsPage();
  };
}

function nextCreditsPage() {
  creditsPage++;

  if (creditsPage < creditsData.length) {
    // Ещё есть страницы — рендерим следующую
    renderCreditsPage();
  } else {
    // Все страницы прошли — финальный экран
    showCreditsFinal();
  }
}

function launchConfetti() {
  const colors = ['#ffd700', '#ff6b6b', '#4ecdc4', '#a29bfe', '#fd79a8', '#55efc4'];
  for (let i = 0; i < 90; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.animationDelay = Math.random() * 1.5 + 's';
    c.style.animationDuration = (2 + Math.random() * 2) + 's';
    c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 5000);
  }
}

  }, 500);

document.addEventListener('visibilitychange', () => {
  if (!musicEl) return;
  if (document.hidden) {
    musicEl.pause();
  } else if (!soundMuted) {
    musicEl.play().catch(() => {});
  }
});

document.addEventListener('touchstart', function unlockAudio() {
  Object.keys(AUDIO).forEach(key => {
    if (!AUDIO[key] || (key in audioCache)) return;
    const a = new Audio(AUDIO[key]);
    a.preload = 'auto';
    audioCache[key] = a;
  });
  document.removeEventListener('touchstart', unlockAudio);
}, { once: true });

/* Отключаем двойной клик-зум */
document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });

/* Отключаем контекстное меню при долгом нажатии */
document.addEventListener('contextmenu', (e) => {
  if (e.target.tagName !== 'INPUT') e.preventDefault();
});
